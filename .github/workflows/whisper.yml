name: whisper-windows

on:
  push:
    paths:
      - 'src/Soltex.Whisper/**'
      - 'src/Soltex.Whisper.Windows/**'
      - 'src/Soltex.App/Views/WhisperView.xaml'
      - 'src/Soltex.App/Views/WhisperView.xaml.cs'
      - 'src/Soltex.App/WhisperOverlayWindow.xaml'
      - 'src/Soltex.App/WhisperOverlayWindow.xaml.cs'
      - 'src/Soltex.App/MainWindow.Whisper.cs'
      - 'src/Soltex.App/WhisperSettingsStore.cs'
      - 'tests/Soltex.Whisper.Tests/**'
      - 'tests/Soltex.Whisper.Windows.Tests/**'
      - 'docs/WHISPER_TOOL_SPEC.md'
      - 'docs/WHISPER_IMPLEMENTATION_PLAN.md'
      - '.github/workflows/whisper.yml'
  pull_request:
    paths:
      - 'src/Soltex.Whisper/**'
      - 'src/Soltex.Whisper.Windows/**'
      - 'src/Soltex.App/Views/WhisperView.xaml'
      - 'src/Soltex.App/Views/WhisperView.xaml.cs'
      - 'src/Soltex.App/WhisperOverlayWindow.xaml'
      - 'src/Soltex.App/WhisperOverlayWindow.xaml.cs'
      - 'src/Soltex.App/MainWindow.Whisper.cs'
      - 'src/Soltex.App/WhisperSettingsStore.cs'
      - 'tests/Soltex.Whisper.Tests/**'
      - 'tests/Soltex.Whisper.Windows.Tests/**'
      - 'docs/WHISPER_TOOL_SPEC.md'
      - 'docs/WHISPER_IMPLEMENTATION_PLAN.md'
      - '.github/workflows/whisper.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  whisper-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Prepare Whisper evidence directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force .\artifacts\whisper | Out-Null

      - name: Build Whisper Windows integration
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build .\tests\Soltex.Whisper.Tests\Soltex.Whisper.Tests.csproj `
            --configuration Release `
            --nologo 2>&1 |
            Tee-Object -FilePath .\artifacts\whisper\build-core-release.log
          if ($LASTEXITCODE -ne 0) {
            throw "Whisper core Release build failed with exit code $LASTEXITCODE."
          }
          dotnet build .\tests\Soltex.Whisper.Windows.Tests\Soltex.Whisper.Windows.Tests.csproj `
            --configuration Release `
            --nologo 2>&1 |
            Tee-Object -FilePath .\artifacts\whisper\build-release.log
          if ($LASTEXITCODE -ne 0) {
            throw "Whisper Release build failed with exit code $LASTEXITCODE."
          }

      - name: Run Whisper core suite
        id: core_tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run `
            --project .\tests\Soltex.Whisper.Tests\Soltex.Whisper.Tests.csproj `
            --configuration Release `
            --no-build 2>&1 |
            Tee-Object -FilePath .\artifacts\whisper\tests-core.log
          if ($LASTEXITCODE -ne 0) {
            throw "Whisper core suite failed with exit code $LASTEXITCODE."
          }

      - name: Run Whisper Windows capture suite
        id: windows_tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run `
            --project .\tests\Soltex.Whisper.Windows.Tests\Soltex.Whisper.Windows.Tests.csproj `
            --configuration Release `
            --no-build 2>&1 |
            Tee-Object -FilePath .\artifacts\whisper\tests-windows-capture.log
          if ($LASTEXITCODE -ne 0) {
            throw "Whisper Windows capture suite failed with exit code $LASTEXITCODE."
          }

      - name: Record Whisper gate classification
        if: always()
        shell: pwsh
        run: |
          $classification = if ('${{ steps.build.outcome }}' -eq 'success' -and
                                '${{ steps.core_tests.outcome }}' -eq 'success' -and
                                '${{ steps.windows_tests.outcome }}' -eq 'success') {
            'The Whisper policy core and Windows capture adapter built and passed deterministic tests. Hosted CI does not prove microphone permission, live device capture, transcription, focused-control delivery, global shortcuts, accessibility, or submission.'
          } else {
            "The Whisper gate is incomplete: build=${{ steps.build.outcome }}; core_tests=${{ steps.core_tests.outcome }}; windows_tests=${{ steps.windows_tests.outcome }}."
          }
          @(
            "build=${{ steps.build.outcome }}"
            "core_tests=${{ steps.core_tests.outcome }}"
            "windows_tests=${{ steps.windows_tests.outcome }}"
            $classification
          ) | Set-Content -Encoding UTF8 .\artifacts\whisper\gate-classification.log
          Add-Content -Encoding UTF8 -Path $env:GITHUB_STEP_SUMMARY -Value '## Soltex Whisper core gate'
          Add-Content -Encoding UTF8 -Path $env:GITHUB_STEP_SUMMARY -Value ''
          Add-Content -Encoding UTF8 -Path $env:GITHUB_STEP_SUMMARY -Value $classification

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        name: Upload Whisper evidence
        if: always()
        with:
          name: soltex-whisper-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/whisper/**
          if-no-files-found: warn
          retention-days: 14
