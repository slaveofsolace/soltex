name: windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  build-test-render:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Prepare evidence directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force .\artifacts\validation | Out-Null

      - name: Build Release
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build .\WaveSlate.sln --configuration Release 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\build-release.log
          if ($LASTEXITCODE -ne 0) { throw "Release build failed with exit code $LASTEXITCODE." }

      - name: Run 27-check default suite
        id: default_tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project .\tests\WaveSlate.Security.Tests\WaveSlate.Security.Tests.csproj --configuration Release --no-build 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\tests-default.log
          if ($LASTEXITCODE -ne 0) { throw "Default suite failed with exit code $LASTEXITCODE." }

      - name: Run supply-chain hardening suite
        id: supply_chain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project .\tests\WaveSlate.Security.SupplyChain.Tests\WaveSlate.Security.SupplyChain.Tests.csproj --configuration Release --no-build 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\tests-supply-chain.log
          if ($LASTEXITCODE -ne 0) { throw "Supply-chain suite failed with exit code $LASTEXITCODE." }

      - name: Run storage, publisher, ZIP, and workflow hostile suite
        id: hardening
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project .\tests\WaveSlate.Security.Hardening.Tests\WaveSlate.Security.Hardening.Tests.csproj --configuration Release --no-build 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\tests-security-hardening.log
          if ($LASTEXITCODE -ne 0) { throw "Security hardening suite failed with exit code $LASTEXITCODE." }

      - name: Run update planner hostile suite
        id: update_tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project .\tests\WaveSlate.Update.Tests\WaveSlate.Update.Tests.csproj --configuration Release --no-build 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\tests-update-planner.log
          if ($LASTEXITCODE -ne 0) { throw "Update planner suite failed with exit code $LASTEXITCODE." }

      - name: Run 28-check EICAR interoperability suite
        id: eicar
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:WAVESLATE_RUN_EICAR = '1'
          dotnet run --project .\tests\WaveSlate.Security.Tests\WaveSlate.Security.Tests.csproj --configuration Release --no-build 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\tests-eicar.log
          if ($LASTEXITCODE -ne 0) { throw "EICAR interoperability suite failed with exit code $LASTEXITCODE." }

      - name: Render Security panel
        id: render_security
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project .\src\WaveSlate.App\WaveSlate.App.csproj --configuration Release --no-build -- --render-smoke .\artifacts\visual\security-current-source.png --panel security 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\render-security.log
          if ($LASTEXITCODE -ne 0) { throw "Security render failed with exit code $LASTEXITCODE." }

      - name: Render Remote Assist panel
        id: render_remote
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project .\src\WaveSlate.App\WaveSlate.App.csproj --configuration Release --no-build -- --render-smoke .\artifacts\visual\remote-assist-current-source.png --panel remote 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\render-remote-assist.log
          if ($LASTEXITCODE -ne 0) { throw "Remote Assist render failed with exit code $LASTEXITCODE." }

      - name: Render Updates panel
        id: render_update
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project .\src\WaveSlate.App\WaveSlate.App.csproj --configuration Release --no-build -- --render-smoke .\artifacts\visual\updates-current-source.png --panel update 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\render-updates.log
          if ($LASTEXITCODE -ne 0) { throw "Updates render failed with exit code $LASTEXITCODE." }

      - name: Verify render evidence
        id: verify_renders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(
            '.\artifacts\visual\security-current-source.png',
            '.\artifacts\visual\remote-assist-current-source.png',
            '.\artifacts\visual\updates-current-source.png'
          )
          foreach ($path in $expected) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected render artifact was not created: $path"
            }
          }
          $renderErrors = Get-ChildItem .\artifacts\visual -Filter '*.error.txt' -File -ErrorAction SilentlyContinue
          if ($renderErrors) {
            foreach ($errorFile in $renderErrors) {
              Write-Host "Render error: $($errorFile.FullName)"
              Get-Content -LiteralPath $errorFile.FullName
            }
            throw 'A render-smoke error file was produced.'
          }

      - name: Record complete-gate classification
        if: always()
        shell: pwsh
        run: |
          $outcomes = [ordered]@{
            build = '${{ steps.build.outcome }}'
            default_tests = '${{ steps.default_tests.outcome }}'
            supply_chain = '${{ steps.supply_chain.outcome }}'
            hardening = '${{ steps.hardening.outcome }}'
            update_tests = '${{ steps.update_tests.outcome }}'
            render_security = '${{ steps.render_security.outcome }}'
            render_remote = '${{ steps.render_remote.outcome }}'
            render_update = '${{ steps.render_update.outcome }}'
            verify_renders = '${{ steps.verify_renders.outcome }}'
            eicar = '${{ steps.eicar.outcome }}'
          }
          $requiredFailures = @(
            $outcomes.GetEnumerator() |
              Where-Object {
                $_.Key -ne 'eicar' -and $_.Value -ne 'success'
              } |
              ForEach-Object { "$($_.Key)=$($_.Value)" }
          )
          if ($requiredFailures.Count -gt 0) {
            $classification = 'The repository gate is incomplete: ' + ($requiredFailures -join ', ') + '.'
          } elseif ($outcomes.eicar -eq 'success') {
            $classification = 'Release build, required security suites, native renders, and the 28-check interoperability suite completed.'
          } else {
            $classification = 'Release build, required security suites, and native renders completed; the hosted Windows AMSI provider did not block the in-memory EICAR marker, so 28/28 remains pending on an owner-controlled Windows host.'
          }
          @(
            $outcomes.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" }
            $classification
          ) | Set-Content -Encoding UTF8 .\artifacts\validation\gate-classification.log
          Add-Content -Encoding UTF8 -Path $env:GITHUB_STEP_SUMMARY -Value "## Soltex Windows gate"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Encoding UTF8 -Path $env:GITHUB_STEP_SUMMARY -Value $classification
          if ($requiredFailures.Count -gt 0 -or $outcomes.eicar -ne 'success') {
            Write-Warning $classification
          }

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        name: Upload Windows evidence
        if: always()
        with:
          name: soltex-windows-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/validation/**
            artifacts/visual/security-current-source.png
            artifacts/visual/remote-assist-current-source.png
            artifacts/visual/updates-current-source.png
            artifacts/visual/*.error.txt
          if-no-files-found: warn
          retention-days: 30
