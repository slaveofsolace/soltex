name: windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  build-test-render:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Prepare evidence directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force .\artifacts\validation | Out-Null

      - name: Verify Soltex identity policy
        id: identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\eng\verify-identity.ps1 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\identity-policy.log

      - name: Verify Soltex design tokens
        id: design_tokens
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\eng\verify-design-tokens.ps1 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\design-tokens.log

      - name: Build Release
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build .\Soltex.sln --configuration Release 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\build-release.log
          if ($LASTEXITCODE -ne 0) { throw "Release build failed with exit code $LASTEXITCODE." }

      - name: Run default security suite
        id: default_tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project .\tests\Soltex.Security.Tests\Soltex.Security.Tests.csproj --configuration Release --no-build 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\tests-default.log
          if ($LASTEXITCODE -ne 0) { throw "Default suite failed with exit code $LASTEXITCODE." }

      - name: Run supply-chain hardening suite
        id: supply_chain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project .\tests\Soltex.Security.SupplyChain.Tests\Soltex.Security.SupplyChain.Tests.csproj --configuration Release --no-build 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\tests-supply-chain.log
          if ($LASTEXITCODE -ne 0) { throw "Supply-chain suite failed with exit code $LASTEXITCODE." }

      - name: Run storage, publisher, ZIP, and workflow hostile suite
        id: hardening
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project .\tests\Soltex.Security.Hardening.Tests\Soltex.Security.Hardening.Tests.csproj --configuration Release --no-build 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\tests-security-hardening.log
          if ($LASTEXITCODE -ne 0) { throw "Security hardening suite failed with exit code $LASTEXITCODE." }

      - name: Run update planner hostile suite
        id: update_tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project .\tests\Soltex.Update.Tests\Soltex.Update.Tests.csproj --configuration Release --no-build 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\tests-update-planner.log
          if ($LASTEXITCODE -ne 0) { throw "Update planner suite failed with exit code $LASTEXITCODE." }

      - name: Run device fabric policy suite
        id: device_fabric_tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project .\tests\Soltex.DeviceFabric.Tests\Soltex.DeviceFabric.Tests.csproj --configuration Release --no-build 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\tests-device-fabric.log
          if ($LASTEXITCODE -ne 0) { throw "Device Fabric suite failed with exit code $LASTEXITCODE." }

      - name: Run bounded monitoring provider suite
        id: monitoring_tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project .\tests\Soltex.Monitoring.Tests\Soltex.Monitoring.Tests.csproj --configuration Release --no-build 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\tests-monitoring.log
          if ($LASTEXITCODE -ne 0) { throw "Monitoring provider suite failed with exit code $LASTEXITCODE." }

      - name: Run bounded audio endpoint suite
        id: audio_tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project .\tests\Soltex.Audio.Tests\Soltex.Audio.Tests.csproj --configuration Release --no-build 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\tests-audio.log
          if ($LASTEXITCODE -ne 0) { throw "Audio endpoint/session suite failed with exit code $LASTEXITCODE." }

      - name: Run bounded benchmark suite
        id: benchmark_tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project .\tests\Soltex.Benchmarks.Tests\Soltex.Benchmarks.Tests.csproj --configuration Release --no-build 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\tests-benchmarks.log
          if ($LASTEXITCODE -ne 0) { throw "Benchmark suite failed with exit code $LASTEXITCODE." }

      - name: Run WPF control suite
        id: app_tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project .\tests\Soltex.App.Tests\Soltex.App.Tests.csproj --configuration Release --no-build 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\tests-app-controls.log
          if ($LASTEXITCODE -ne 0) { throw "WPF control suite failed with exit code $LASTEXITCODE." }

      - name: Measure native runtime lifecycle cost
        id: runtime_cost
        shell: pwsh
        env:
          SOLTEX_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\eng\measure-runtime.ps1 `
            -OutputDirectory .\artifacts\validation `
            -Configuration Release `
            -SourceHeadSha $env:SOLTEX_SOURCE_HEAD_SHA `
            -TestedCommitSha $env:GITHUB_SHA `
            -DotnetPath (Get-Command dotnet -ErrorAction Stop).Source

      - name: Run opt-in EICAR interoperability suite
        id: eicar
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SOLTEX_RUN_EICAR = '1'
          dotnet run --project .\tests\Soltex.Security.Tests\Soltex.Security.Tests.csproj --configuration Release --no-build 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\tests-eicar.log
          if ($LASTEXITCODE -ne 0) { throw "EICAR interoperability suite failed with exit code $LASTEXITCODE." }

      - name: Capture complete UI evidence matrix
        id: render_matrix
        shell: pwsh
        env:
          SOLTEX_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\eng\capture-ui-evidence.ps1 `
            -OutputDirectory .\artifacts\visual `
            -ValidationDirectory .\artifacts\validation `
            -Configuration Release `
            -SourceHeadSha $env:SOLTEX_SOURCE_HEAD_SHA `
            -TestedCommitSha $env:GITHUB_SHA `
            -DotnetPath (Get-Command dotnet -ErrorAction Stop).Source

      - name: Record complete-gate classification
        if: always()
        shell: pwsh
        run: |
          $outcomes = [ordered]@{
            identity = '${{ steps.identity.outcome }}'
            design_tokens = '${{ steps.design_tokens.outcome }}'
            build = '${{ steps.build.outcome }}'
            default_tests = '${{ steps.default_tests.outcome }}'
            supply_chain = '${{ steps.supply_chain.outcome }}'
            hardening = '${{ steps.hardening.outcome }}'
            update_tests = '${{ steps.update_tests.outcome }}'
            device_fabric_tests = '${{ steps.device_fabric_tests.outcome }}'
            monitoring_tests = '${{ steps.monitoring_tests.outcome }}'
            audio_tests = '${{ steps.audio_tests.outcome }}'
            app_tests = '${{ steps.app_tests.outcome }}'
            runtime_cost = '${{ steps.runtime_cost.outcome }}'
            render_matrix = '${{ steps.render_matrix.outcome }}'
            eicar = '${{ steps.eicar.outcome }}'
          }
          $requiredFailures = @(
            $outcomes.GetEnumerator() |
              Where-Object {
                $_.Key -ne 'eicar' -and $_.Value -ne 'success'
              } |
              ForEach-Object { "$($_.Key)=$($_.Value)" }
          )
          if ($requiredFailures.Count -gt 0) {
            $classification = 'The repository gate is incomplete: ' + ($requiredFailures -join ', ') + '.'
          } elseif ($outcomes.eicar -eq 'success') {
            $classification = 'Release build, required security suites, native renders, and the opt-in EICAR interoperability suite completed.'
          } else {
            $classification = 'Release build, required security suites, and native renders completed; the hosted Windows AMSI provider did not block the in-memory EICAR marker, so provider-interoperability confirmation remains pending on an owner-controlled Windows host.'
          }
          @(
            $outcomes.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" }
            $classification
          ) | Set-Content -Encoding UTF8 .\artifacts\validation\gate-classification.log
          Add-Content -Encoding UTF8 -Path $env:GITHUB_STEP_SUMMARY -Value "## Soltex Windows gate"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Encoding UTF8 -Path $env:GITHUB_STEP_SUMMARY -Value $classification
          if ($requiredFailures.Count -gt 0 -or $outcomes.eicar -ne 'success') {
            Write-Warning $classification
          }

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        name: Upload Windows evidence
        if: always()
        with:
          name: soltex-windows-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/validation/**
            artifacts/visual/**
            artifacts/visual/*.error.txt
          if-no-files-found: warn
          retention-days: 30
